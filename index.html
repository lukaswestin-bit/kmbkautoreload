<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Image Reload</title>

<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    img {
        max-width: 100%;
        max-height: 100%;
    }
</style>

<script>
    function refreshImage() {
        const img = document.getElementById("liveImage");

        // Prevent cache by adding timestamp
        img.src = "https://files.kmbk.se:53131/snap.jpeg?t=" + new Date().getTime();
    }

    window.onload = () => {
        refreshImage();

        // Refresh every 2 seconds
        setInterval(refreshImage, 2000);
    };
</script>
</head>

<body>
    <img id="liveImage" src="" alt="Live Image">
</body>
</html>
